<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#07293c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gleam">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2307293c'/%3E%3Crect x='38' y='34' width='104' height='104' rx='10' fill='none' stroke='%237fe3ff' stroke-width='7'/%3E%3Cpath d='M90 34v104M38 86h104' stroke='%237fe3ff' stroke-width='7'/%3E%3Cpath d='M52 118c14-10 28-16 40-34' stroke='%23fff' stroke-width='9' stroke-linecap='round' opacity='.85'/%3E%3C/svg%3E">
<title>Gleam² — Window Cleaning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#04141f;--deep:#07293c;--mid:#0e4b68;
  --glass:rgba(255,255,255,.075);--glass-2:rgba(255,255,255,.12);--edge:rgba(255,255,255,.18);
  --text:#eef7fb;--dim:rgba(238,247,251,.58);--faint:rgba(238,247,251,.36);
  --aqua:#7fe3ff;--suds:#f5d67b;--clean:#5fe3b0;--dirt:#ff8f7a;
  --r:20px;--pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:manipulation}
body{margin:0;background:var(--ink);color:var(--text);font-family:Inter,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;overflow:hidden}
#app{position:relative;display:flex;flex-direction:column;width:100%;max-width:440px;min-width:0;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 80% at 10% 0%, #10597e 0%, transparent 55%),
    radial-gradient(100% 70% at 100% 10%, #0d3f5c 0%, transparent 60%),
    linear-gradient(180deg,#07293c 0%,#04141f 70%)}
#app::before{content:'';position:absolute;inset:-30%;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(127,227,255,.20),transparent) 20% 25%/46% 46% no-repeat,
    radial-gradient(closest-side,rgba(95,227,176,.13),transparent) 85% 60%/50% 50% no-repeat,
    radial-gradient(closest-side,rgba(245,214,123,.10),transparent) 40% 95%/44% 44% no-repeat;
  filter:blur(10px);animation:drift 34s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-4%,3%,0) scale(1.08)}}

.glass{position:relative;background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 10px 34px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.22)}
.glass::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.14),transparent 38%)}

header{position:relative;z-index:3;flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 10px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:9px}
.brand h1{font-family:Archivo,Inter,sans-serif;font-weight:700;font-size:24px;letter-spacing:-.035em;margin:0;
  background:linear-gradient(100deg,#fff,var(--aqua));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-size:10.5px;letter-spacing:.20em;text-transform:uppercase;color:var(--faint)}
.hbtns{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass);
  border:1px solid var(--edge);color:var(--text);backdrop-filter:blur(14px);cursor:pointer;font-size:16px}
.pagetitle{margin:14px 0 2px;font-family:Archivo,sans-serif;font-size:27px;letter-spacing:-.03em;font-weight:700}
.pagesub{color:var(--dim);font-size:13px;margin-bottom:12px}
.saved{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.saved b{color:var(--clean);font-weight:600}

.rain{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1;opacity:.5}
.drop{position:absolute;top:-14px;width:2px;height:12px;border-radius:2px;
  background:linear-gradient(180deg,transparent,rgba(200,240,255,.85));animation:fall linear infinite}
@keyframes fall{to{transform:translateY(190px);opacity:0}}

main{position:relative;z-index:2;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 var(--pad) calc(96px + env(safe-area-inset-bottom) + 20px);scroll-behavior:smooth}
.page{display:none}
.page.on{display:block}
.page.wipe{animation:wipein .34s cubic-bezier(.4,0,.2,1)}
@keyframes wipein{from{clip-path:inset(0 100% 0 0);opacity:.5}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stat{padding:11px 12px;border-radius:16px}
.stat b{display:block;font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--faint)}
.stat.owed b{color:var(--suds)} .stat.late b{color:var(--dirt)}

.card{position:relative;overflow:hidden;padding:14px;margin-bottom:10px;border-radius:18px}
.card .row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .r1l{min-width:0;flex:1}
.card .r1r{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.addr{font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.who{color:var(--dim);font-size:12.5px;margin-top:1px}
.price{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:16px;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:10.5px;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);color:var(--dim)}
.chip.round{color:var(--aqua);border-color:rgba(127,227,255,.32)}
.chip.debt{color:var(--suds);border-color:rgba(245,214,123,.3)}
.chip.late{color:var(--dirt);border-color:rgba(255,143,122,.3)}
.chip.rise{color:var(--clean);border-color:rgba(95,227,176,.3)}
.chip.note{color:var(--text);border-color:rgba(255,255,255,.22)}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:10px;border-radius:13px;border:1px solid var(--edge);background:var(--glass-2);color:var(--text);
  font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(120deg,rgba(127,227,255,.30),rgba(95,227,176,.22));border-color:rgba(127,227,255,.45)}
.btn.danger{background:rgba(255,143,122,.16);border-color:rgba(255,143,122,.4);color:#ffd9d1}
.btn.warn{background:rgba(245,214,123,.16);border-color:rgba(245,214,123,.42);color:#ffedc2}
.btn.paid{background:linear-gradient(120deg,rgba(95,227,176,.34),rgba(127,227,255,.18));border-color:rgba(95,227,176,.5)}
.btn.ghost{flex:0 0 auto;padding:10px 14px;color:var(--dim)}
.payask{margin-top:12px;animation:wipein .3s cubic-bezier(.4,0,.2,1)}
.payask .q{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--aqua);margin-bottom:8px;text-align:center}
.payask .acts{margin-top:8px}
.btn:focus-visible,.iconbtn:focus-visible,.tab:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}

/* squeegee wipe — the signature */
.grime{position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;
  background:radial-gradient(circle at 12% 30%,rgba(255,255,255,.30) 0 2px,transparent 3px),
    radial-gradient(circle at 28% 70%,rgba(255,255,255,.22) 0 3px,transparent 4px),
    radial-gradient(circle at 44% 22%,rgba(255,255,255,.26) 0 2px,transparent 3px),
    radial-gradient(circle at 61% 62%,rgba(255,255,255,.20) 0 3px,transparent 4px),
    radial-gradient(circle at 76% 34%,rgba(255,255,255,.28) 0 2px,transparent 3px),
    radial-gradient(circle at 90% 74%,rgba(255,255,255,.22) 0 3px,transparent 4px),
    linear-gradient(120deg,rgba(255,255,255,.05),transparent)}
.blade{position:absolute;top:-10%;bottom:-10%;left:0;width:16px;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(127,227,255,.5),rgba(255,255,255,0));
  filter:blur(.4px);box-shadow:0 0 26px rgba(127,227,255,.65)}
.card.cleaning .grime{opacity:1;animation:wipeaway .72s cubic-bezier(.5,0,.2,1) forwards}
.card.cleaning .blade{opacity:1;animation:swipe .72s cubic-bezier(.5,0,.2,1) forwards}
.card.cleaning{animation:sparkle .72s ease forwards}
@keyframes wipeaway{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 100%)}}
@keyframes swipe{from{transform:translateX(-16px)}to{transform:translateX(440px)}}
@keyframes sparkle{60%{border-color:rgba(127,227,255,.7)}100%{transform:scale(.96);opacity:0;margin-bottom:-10px;padding:0;height:0}}

/* spotlight + progress */
.card.spot{border-color:rgba(127,227,255,.4);box-shadow:0 12px 40px rgba(0,0,0,.36), 0 0 0 1px rgba(127,227,255,.12), inset 0 1px 0 rgba(255,255,255,.24)}
.card.spot .addr{font-size:18px}
.eyebrow{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--aqua);margin-bottom:6px}
.ringwrap{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;margin-bottom:12px}
.ringwrap .txt{flex:1}
.ringwrap b{font-family:"JetBrains Mono",monospace;font-size:17px;display:block}
.ringwrap span{font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.ring{width:52px;height:52px;flex:0 0 auto;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.12)}
.ring .fg{stroke:var(--clean);transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ringpct{position:absolute;font-size:10px;font-family:"JetBrains Mono",monospace}

.seg{display:flex;gap:4px;padding:4px;border-radius:14px;margin-bottom:14px;background:rgba(255,255,255,.06);border:1px solid var(--edge)}
.seg button{flex:1;padding:8px;border:0;border-radius:11px;background:transparent;color:var(--dim);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--glass-2);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.seg.scroll{overflow-x:auto}
.seg.scroll button{flex:0 0 auto;padding:8px 12px}
.list{border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.item:last-child{border-bottom:0}
.item:active{background:rgba(255,255,255,.05)}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .grow span{font-size:12px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:600;text-align:right;white-space:nowrap}
.num.owe{color:var(--suds)} .num.clear{color:var(--clean)} .num.bad{color:var(--dirt)}
.sect{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center}
input,select,textarea{width:100%;padding:11px 12px;border-radius:13px;border:1px solid var(--edge);background:rgba(255,255,255,.07);
  color:var(--text);font:inherit;font-size:14px;margin-bottom:10px}
input::placeholder,textarea::placeholder{color:var(--faint)}
select option{background:#07293c}
label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.heat{height:7px;border-radius:7px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px}
.heat i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,rgba(127,227,255,.85),rgba(95,227,176,.8))}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar .lbl{width:96px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{flex:1;height:9px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .fill{height:100%;border-radius:9px;background:linear-gradient(90deg,rgba(127,227,255,.85),rgba(95,227,176,.75));transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scaleX(0)}}
.bar .val{width:56px;text-align:right;font-family:"JetBrains Mono",monospace;font-size:12.5px}

.tick{width:24px;height:24px;border-radius:8px;border:1px solid var(--edge);display:grid;place-items:center;font-size:12px;flex:0 0 auto}
.tick.on{background:linear-gradient(120deg,rgba(127,227,255,.5),rgba(95,227,176,.4));border-color:var(--aqua)}
.sent{color:var(--clean);font-size:11.5px;font-family:"JetBrains Mono",monospace}
.nonum{color:var(--dirt);font-size:11px}
.preview{padding:13px;border-radius:16px;font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:14px;
  background:rgba(127,227,255,.07);border:1px solid rgba(127,227,255,.2)}
.preview b{color:var(--text);font-weight:500}
.banner{padding:12px 14px;border-radius:16px;margin-bottom:12px;font-size:12.5px;color:var(--text);
  background:rgba(245,214,123,.10);border:1px solid rgba(245,214,123,.28);display:flex;gap:10px;align-items:center}
.banner button{margin-left:auto;background:none;border:0;color:var(--suds);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}

nav{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:5;display:flex;padding:6px;border-radius:22px;
  background:rgba(10,40,58,.55);border:1px solid var(--edge);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);
  box-shadow:0 14px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.2)}
.tab{flex:1;border:0;background:transparent;color:var(--faint);font:inherit;font-size:9.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;padding:8px 2px 6px;border-radius:16px;cursor:pointer;display:grid;gap:3px;justify-items:center}
.tab i{font-style:normal;font-size:17px;filter:grayscale(1) opacity(.65)}
.tab.on{color:var(--text);background:rgba(255,255,255,.10)}
.tab.on i{filter:none}
.fab{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 88px);z-index:6;width:54px;height:54px;border-radius:50%;
  border:1px solid rgba(127,227,255,.5);cursor:pointer;background:linear-gradient(140deg,rgba(127,227,255,.45),rgba(95,227,176,.3));
  backdrop-filter:blur(18px);color:#fff;font-size:26px;line-height:1;box-shadow:0 10px 30px rgba(0,0,0,.4)}

.scrim{position:fixed;inset:0;z-index:7;background:rgba(2,12,20,.55);backdrop-filter:blur(3px);display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:440px;bottom:0;z-index:8;max-height:88vh;max-height:88dvh;overflow-y:auto;overflow-x:hidden;border-radius:26px 26px 0 0;
  padding:46px 16px calc(env(safe-area-inset-bottom) + 20px);background:rgba(9,44,64,.94);border:1px solid var(--edge);border-bottom:0;
  backdrop-filter:blur(30px) saturate(160%);transition:transform .32s cubic-bezier(.3,.9,.3,1)}
.sheet.on{transform:translateX(-50%) translateY(0)}
.handle{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.28);margin:6px auto 14px}
.sheet h3{font-family:Archivo,sans-serif;font-size:20px;margin:0 0 2px;letter-spacing:-.02em}
.sheet .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13.5px}
.kv span{color:var(--dim)}
.kv b{font-family:"JetBrains Mono",monospace;font-weight:600;text-align:right}
.tl{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12.5px}
.tl .d{font-family:"JetBrains Mono",monospace;color:var(--faint);flex:0 0 74px}
.tl .b{flex:1}
.tl .a{font-family:"JetBrains Mono",monospace}

.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:9;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  transition:.25s;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:15px;font-size:13px;max-width:92%;
  background:rgba(9,44,64,.9);border:1px solid var(--edge);backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--aqua);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.empty{text-align:center;padding:44px 20px;color:var(--dim);font-size:13.5px}
.empty div{font-size:34px;margin-bottom:10px;opacity:.5}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:4px}

/* ---- v3 additions ---- */
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 14px}
.titlerow .pagetitle{margin:0}
.rainbtn{flex:0 0 auto;padding:9px 13px;border-radius:13px;border:1px solid rgba(127,227,255,.34);background:var(--glass);color:var(--text);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;backdrop-filter:blur(14px)}
.progresshero{padding:15px 17px;border-radius:20px;margin-bottom:14px}
.prog-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.prog-count{font-family:"JetBrains Mono",monospace;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.prog-count span{font-size:17px;color:var(--faint)}
.prog-top small{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.11em;display:block;margin-top:6px}
.prog-money{display:flex;gap:16px;text-align:right}
.prog-money b{font-family:"JetBrains Mono",monospace;font-size:17px;display:block;line-height:1.1}
.prog-money b.clean{color:var(--clean)} .prog-money b.suds{color:var(--suds)}
.prog-money span{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.09em}
.prog-bar{height:9px;border-radius:9px;background:rgba(255,255,255,.10);overflow:hidden}
.prog-bar i{display:block;height:100%;border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(90deg,rgba(127,227,255,.9),rgba(95,227,176,.85))}
.prog-rounds{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.earn{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px;border-radius:20px;margin-bottom:14px}
.earn .big{font-family:"JetBrains Mono",monospace;font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1}
.earn small{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.11em;display:block;margin-top:6px}
.earn .done{text-align:right;font-size:12.5px;color:var(--dim);line-height:1.5}
.earn .done b{color:var(--clean);font-family:"JetBrains Mono",monospace;font-size:15px}
.cardtools{display:flex;gap:5px;flex:0 0 auto;align-items:center}
.cardtools button{width:29px;height:29px;border-radius:9px;border:1px solid var(--edge);background:var(--glass);color:var(--text);font-size:12px;cursor:pointer;display:grid;place-items:center;padding:0}
.cardtools button:disabled{opacity:.28}
.cal{padding:12px;border-radius:20px;margin-bottom:12px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead b{font-family:Archivo,sans-serif;font-size:16px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:9px;color:var(--faint);padding-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;cursor:pointer;border:1px solid transparent;color:var(--dim)}

.selrow{display:flex;gap:8px;margin-bottom:12px;align-items:stretch}

.hedit{display:flex;gap:6px;flex:0 0 auto}
.hedit button{width:27px;height:27px;border-radius:8px;border:1px solid var(--edge);background:var(--glass);color:var(--dim);font-size:11px;cursor:pointer;padding:0}
.txttype{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.txttype button{flex:0 0 auto;padding:9px 14px;border-radius:13px;border:1px solid var(--edge);background:var(--glass);color:var(--dim);font:inherit;font-size:13px;font-weight:600;cursor:pointer}

.sendbtn{flex:0 0 auto;padding:8px 13px;border-radius:11px;border:1px solid rgba(127,227,255,.42);background:linear-gradient(120deg,rgba(127,227,255,.3),rgba(95,227,176,.18));color:#fff;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.sendbtn.done{background:rgba(95,227,176,.14);border-color:rgba(95,227,176,.4);color:var(--clean)}

/* outdoor mode — same layout, brighter */
body.outdoor{font-size:16.5px}
body.outdoor #app{--text:#ffffff;--dim:rgba(255,255,255,.86);--faint:rgba(255,255,255,.72);
  --glass:rgba(255,255,255,.17);--glass-2:rgba(255,255,255,.26);--edge:rgba(255,255,255,.45);
  --aqua:#b7f0ff;--suds:#ffe28f;--clean:#8bffcd;--dirt:#ffb2a2;

/* ---- v4 additions ---- */
input[type=date]{appearance:none;-webkit-appearance:none;width:100%;min-width:0}
.two>*{min-width:0}
select{min-width:0}
.grabber{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.28);z-index:2;pointer-events:none}
/* search UX */
.todaysearch{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
.searchwrap{position:relative;flex:1;min-width:0}

.clearbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;

.addbtn{flex:0 0 auto;padding:0 14px;border-radius:13px;border:1px solid rgba(127,227,255,.45);
  background:linear-gradient(120deg,rgba(127,227,255,.30),rgba(95,227,176,.22));color:#fff;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.restag{flex:0 0 auto;align-self:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;

.restag.round{color:var(--aqua);border-color:rgba(127,227,255,.32)}
.restag.job{color:var(--clean);border-color:rgba(95,227,176,.36);font-weight:600}
.restag.done{color:var(--aqua);border-color:rgba(127,227,255,.4);font-weight:600}
/* money tab */
.mhero{padding:15px 15px 10px;border-radius:20px;margin-bottom:12px}
.mh-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mh-big{font-family:"JetBrains Mono",monospace;font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1}
.mh-big.clean{color:var(--clean)} .mh-big.aqua{color:var(--aqua)}
.mh-row small{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;display:block;margin-top:5px}
.trend{display:flex;gap:4px;padding:14px 0 0;align-items:flex-end}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.tbars{height:64px;display:flex;align-items:flex-end;gap:2px}
.tbars i{width:6px;border-radius:2px 2px 0 0;min-height:2px;display:block}
.tbars i.e{background:linear-gradient(180deg,rgba(245,214,123,.95),rgba(245,214,123,.4))}
.tbars i.c{background:linear-gradient(180deg,rgba(95,227,176,.95),rgba(95,227,176,.4))}
.tcol span{font-size:8px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tkey{display:flex;gap:14px;justify-content:center;padding:8px 0 2px}
.tkey span{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}
.tkey i{width:8px;height:8px;border-radius:2px;display:block}
.tkey i.e{background:rgba(245,214,123,.9)} .tkey i.c{background:rgba(95,227,176,.9)}
.age{padding:12px 14px;border-radius:16px}
.age-r{display:grid;grid-template-columns:96px 1fr 58px;gap:9px;align-items:center;margin-bottom:9px}
.age-r:last-child{margin-bottom:0}
.age-l{font-size:11.5px;line-height:1.25}
.age-l span{display:block;font-size:9px;color:var(--faint)}
.age-v{font-family:"JetBrains Mono",monospace;font-size:11.5px;text-align:right;color:var(--dim)}
.age-v.clean{color:var(--clean)} .age-v.suds{color:var(--suds)} .age-v.bad{color:var(--dirt)}
.age .track{height:7px}
.age .fill.clean{background:linear-gradient(90deg,rgba(95,227,176,.85),rgba(95,227,176,.5))}
.age .fill.suds{background:linear-gradient(90deg,rgba(245,214,123,.85),rgba(245,214,123,.5))}
.age .fill.bad{background:linear-gradient(90deg,rgba(255,143,122,.9),rgba(255,143,122,.5))}
.dl{flex:0 0 auto;font-size:9px;font-weight:600;letter-spacing:.08em;padding:5px 9px;border-radius:8px;
  background:rgba(127,227,255,.14);border:1px solid rgba(127,227,255,.3);color:var(--aqua)}
/* account summary + statement */
.acct{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:4px}
.acct>div{background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:12px;padding:9px 5px;text-align:center}
.acct b{font-family:"JetBrains Mono",monospace;font-size:13.5px;display:block;line-height:1.2}
.acct b.clean{color:var(--clean)} .acct b.aqua{color:var(--aqua)} .acct b.suds{color:var(--suds)}
.acct span{font-size:8.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.stmtoggle{cursor:pointer;color:var(--aqua);text-transform:none;letter-spacing:0;font-size:11.5px}
.stmt{border:1px solid var(--edge);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.04)}
.stmt-h,.stmt-r{display:grid;grid-template-columns:34px 1fr 50px 50px 56px;gap:4px;align-items:center;padding:8px 9px}
.stmt-h{font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);border-bottom:1px solid var(--edge);background:rgba(255,255,255,.03)}
.stmt-h div:nth-child(n+3){text-align:right}
.stmt-r{border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.stmt-r:last-child{border-bottom:0}
.stmt-r:active{background:rgba(255,255,255,.06)}
.stmt-r .sd{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--dim);line-height:1.15}
.stmt-r .sd i{display:block;font-style:normal;font-size:8.5px;color:var(--faint)}
.stmt-r .sx{min-width:0}
.stmt-r .sx b{font-size:12.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stmt-r .sx span{font-size:10px;color:var(--faint);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stmt-r .sc,.stmt-r .sp,.stmt-r .sb{font-family:"JetBrains Mono",monospace;font-size:11px;text-align:right}
.stmt-r .sc{color:var(--suds)} .stmt-r .sp{color:var(--clean)}
.stmt-r .sb{font-weight:600;color:var(--faint)}
.stmt-r .sb.owe{color:var(--suds)} .stmt-r .sb.cr{color:var(--aqua)}
.rs-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rs-head h3{margin:0}
.selbox{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--edge);background:rgba(255,255,255,.06);
  color:var(--clean);font-size:13px;display:grid;place-items:center;cursor:pointer;padding:0}
.selbox.on{background:rgba(95,227,176,.22);border-color:rgba(95,227,176,.6)}
.selbar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 2px;margin-top:12px;background:linear-gradient(transparent,rgba(9,44,64,.96) 30%)}
.selbar .btn{flex:1;padding:11px 8px;font-size:13px}
.poundwrap{position:relative}
.poundwrap span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:15px;pointer-events:none}
.poundwrap input{padding-left:26px!important}
.suggest{margin:2px 0 14px}
.suggest .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 8px 2px}
.suggestrow{display:flex;flex-wrap:wrap;gap:7px}
.suggestrow .chip{cursor:pointer}
.sheetclose{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:11px;border:1px solid var(--edge);
  background:var(--glass);color:var(--text);font-size:14px;display:grid;place-items:center;cursor:pointer;z-index:2}
.citem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--glass-2);
  border:1px solid var(--edge);margin-bottom:8px}
.citem.spot{border-color:rgba(127,227,255,.4)}
.citem .grow{flex:1;min-width:0;cursor:pointer}
.citem .grow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .grow span{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick{cursor:pointer}
@supports (-webkit-touch-callout:none){ }
@media (max-width:340px){ .stats{gap:6px} .stat{padding:9px 8px} .stat b{font-size:16px} }
.ccard{display:flex;gap:10px;align-items:stretch;padding:13px 14px;border-radius:16px;margin-bottom:9px;cursor:pointer}
.ccard-main{flex:1;min-width:0}
.ccard-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ccard-name{min-width:0;flex:1;overflow:hidden}
.ccard-name b{font-weight:600;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard-head .num{flex:0 0 auto}
.ccard-addr{color:var(--dim);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .meta{margin-top:9px}
.ccard-acts{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;justify-content:center}
.ccard-acts .iconbtn{width:34px;height:34px;font-size:14px;text-decoration:none}
.ccard-acts .iconbtn.sched{color:var(--aqua);border-color:rgba(127,227,255,.4);font-size:18px;font-weight:600}
.ccard-fig{text-align:right;flex:0 0 auto}
.ccard-fig .cprice{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:15px;color:var(--text)}
a.iconbtn{display:grid;place-items:center}

/* ---- v5: day navigation + multi-select ---- */
.card,.citem,.ccard{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.citem,.ccard{position:relative}
.daynav{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.daynav button{width:36px;height:36px;border-radius:12px;border:1px solid var(--edge);background:var(--glass);
  color:var(--text);font-size:16px;cursor:pointer;display:grid;place-items:center;padding:0}
.daysub{font-size:12px;color:var(--dim);margin-top:2px}
.dayflags{display:flex;gap:8px;margin-bottom:12px}
.dayflags .btn{padding:9px 8px;font-size:12.5px}
.selbar2{position:sticky;top:0;z-index:6;padding:11px 13px;border-radius:16px;margin-bottom:12px}
.selhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.selhead b{font-family:"JetBrains Mono",monospace;font-size:14px}
.selhead em{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--clean)}
.selmini{background:none;border:0;color:var(--aqua);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:2px 3px}
.selmini.pull{margin-left:auto}
.selbar2 .acts{margin-top:9px}
.selbar2 .btn{padding:9px 5px;font-size:12.5px}
.selbar2 .btn[disabled]{opacity:.38}
.selmark{position:absolute;top:9px;right:9px;width:23px;height:23px;border-radius:8px;border:1.5px solid var(--edge);
  background:rgba(4,20,31,.55);display:grid;place-items:center;font-size:12px;color:transparent;z-index:3;font-weight:700}
.selmark.on{background:linear-gradient(120deg,rgba(127,227,255,.75),rgba(95,227,176,.6));border-color:var(--aqua);color:#04141f}
.card.picked,.citem.picked,.ccard.picked{border-color:rgba(127,227,255,.6);box-shadow:0 0 0 1px rgba(127,227,255,.28)}
.item.picked{background:rgba(127,227,255,.13)}
.selmode .cardtools,.selmode .card .acts,.selmode .citem .acts,.selmode .ccard-acts,.selmode .restag{display:none}
.selmode .ccard,.selmode .card,.selmode .citem{padding-right:40px}
.holdhint{font-size:11px;color:var(--faint);text-align:center;margin:-2px 0 12px}
.selmode .r1r,.selmode .ccard-fig{pointer-events:none}
.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.wkday{padding:7px 0 6px;border-radius:13px;border:1px solid var(--edge);background:var(--glass);color:var(--dim);
  font:inherit;cursor:pointer;display:grid;gap:1px;justify-items:center;line-height:1.1}
.wkday i{font-style:normal;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.wkday b{font-family:"JetBrains Mono",monospace;font-size:13.5px;font-weight:600;color:var(--text)}
.wkday s{text-decoration:none;font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--aqua);min-height:11px}
.wkday s.clean{color:var(--clean)} .wkday s.none{color:var(--faint)}
.wkday.now{border-color:rgba(127,227,255,.5)}
.wkday.on{background:rgba(127,227,255,.22);border-color:var(--aqua)}
.wkday.on b,.wkday.on i{color:#fff}
.day .dn{font-size:8px;font-family:"JetBrains Mono",monospace;color:var(--clean);margin-top:1px}
.day.wasdone{background:rgba(95,227,176,.10);border-color:rgba(95,227,176,.34);color:var(--text);opacity:1}
.doneitem .num{color:var(--clean)}
.strip{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:16px;margin-bottom:12px;cursor:pointer;
  font-size:12.5px;background:rgba(245,214,123,.10);border:1px solid rgba(245,214,123,.30)}
.strip b{color:var(--suds)}
.strip .go{margin-left:auto;color:var(--suds);font-weight:600;white-space:nowrap}

/* ============================================================
   GLEAM 2.0 NATIVE VISUAL REFRESH
   Same information architecture and controls; quieter hierarchy.
   ============================================================ */
:root{
  --ink:#061a20;--deep:#0b2b33;--mid:#17444d;
  --glass:rgba(255,255,255,.055);--glass-2:rgba(255,255,255,.085);--edge:rgba(255,255,255,.115);
  --text:#f2f8f8;--dim:rgba(242,248,248,.66);--faint:rgba(242,248,248,.40);
  --aqua:#69d6df;--suds:#e6c56b;--clean:#67d7a6;--dirt:#ef8f7f;
  --r:18px;--pad:16px;
}
body{background:#061a20}
#app{
  max-width:520px;
  background:
    radial-gradient(110% 62% at 18% -8%,rgba(30,105,115,.50),transparent 58%),
    linear-gradient(180deg,#0b2b33 0%,#071f27 48%,#061a20 100%);
}
#app::before{opacity:.28;filter:blur(24px);animation-duration:44s}
.rain{opacity:.20}
.glass{
  background:rgba(255,255,255,.05);
  border-color:rgba(255,255,255,.10);
  backdrop-filter:blur(14px) saturate(125%);
  -webkit-backdrop-filter:blur(14px) saturate(125%);
  box-shadow:0 7px 24px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.10);
}
.glass::after{opacity:.38}
header{padding-bottom:7px}
.brand h1{font-size:23px;background:none;color:#f4fbfb;-webkit-text-fill-color:initial}
.brand small{letter-spacing:.14em;color:var(--faint)}
.iconbtn{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10)}
.pagetitle{font-size:25px}
.pagesub,.daysub{color:var(--dim)}
.card{padding:13px 14px;margin-bottom:8px;border-radius:17px}
.card.spot{border-color:rgba(105,214,223,.30);box-shadow:0 8px 24px rgba(0,0,0,.22)}
.card.spot .addr{font-size:17px}
.chip{
  background:rgba(255,255,255,.045);
  border-color:rgba(255,255,255,.08);
  padding:3px 7px;
}
.btn{
  border-color:rgba(255,255,255,.11);
  background:rgba(255,255,255,.065);
  box-shadow:none;
}
.btn.primary{
  background:rgba(105,214,223,.16);
  border-color:rgba(105,214,223,.34);
}
.progresshero,.earn{padding:13px 15px;border-radius:17px}
.prog-count{font-size:28px}
.prog-money{opacity:.62}
.prog-bar{height:7px}
.stat{box-shadow:none}
.list{border-radius:16px}
.item{padding:11px 13px}
.sect{margin-top:17px}
nav{
  left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);
  background:rgba(7,31,39,.92);
  border-color:rgba(255,255,255,.10);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 24px rgba(0,0,0,.34);
}
.tab{color:rgba(242,248,248,.40)}
.tab.on{background:rgba(255,255,255,.075)}
.fab{
  background:#17616b;
  border-color:rgba(105,214,223,.42);
  box-shadow:0 8px 22px rgba(0,0,0,.30);
}
.sheet{
  background:rgba(8,35,43,.985);
  border-color:rgba(255,255,255,.10);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.seg{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.08)}
.seg button.on{background:rgba(255,255,255,.09);box-shadow:none}
.wkstrip{gap:4px}
.wkday{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.075)}
.wkday.on{background:rgba(105,214,223,.14);border-color:rgba(105,214,223,.48)}
.cal{box-shadow:none}
.day{
  border-radius:11px!important;
  box-shadow:none!important;
}
.day.has{background:rgba(105,214,223,.07)!important}
.day.today{border-color:rgba(105,214,223,.58)!important}
.day.sel{background:rgba(105,214,223,.20)!important;border-color:rgba(105,214,223,.62)!important}
.day .n{
  min-width:15px!important;height:15px!important;line-height:15px!important;font-size:8px!important;
  background:rgba(105,214,223,.22)!important;color:#dffbff!important;
}
.day .dn{font-size:8px!important;opacity:.72}
.preview,.banner{box-shadow:none}
.searchwrap input{background:rgba(255,255,255,.045)}
.card.cleaning::before{
  content:'';
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 78%,rgba(218,250,255,.75) 0 3px,transparent 4px),
    radial-gradient(circle at 34% 64%,rgba(218,250,255,.55) 0 2px,transparent 3px),
    radial-gradient(circle at 58% 72%,rgba(218,250,255,.65) 0 4px,transparent 5px),
    radial-gradient(circle at 77% 55%,rgba(218,250,255,.50) 0 2px,transparent 3px),
    radial-gradient(circle at 88% 76%,rgba(218,250,255,.58) 0 3px,transparent 4px);
  animation:gleamBubbles .62s ease-out forwards;
}
@keyframes gleamBubbles{
  0%{opacity:0;transform:translateY(8px) scale(.94)}
  22%{opacity:.9}
  100%{opacity:0;transform:translateY(-18px) scale(1.04)}
}
.native-extra .kv{align-items:center}
.native-extra button{flex:1}
@media (prefers-reduced-motion:reduce){
  .card.cleaning::before{display:none}
}

  <header>

  if(!NATIVE) return;
  try{ GleamNative.haptic(); }catch(_){}

}
function toggleNativeNotifications(){
  if(!NATIVE) return;

  toast(next?"Work reminders on":"Work reminders off");
}
function requestGleamWidget(){
  if(!NATIVE) return;
  try{ GleamNative.requestWidget(); }catch(_){}
}

  async init(){

        r.onupgradeneeded=()=>r.result.createObjectStore("kv");
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);

      });
      this.mode="IndexedDB"; return;
    }catch(e){}
    try{ localStorage.setItem("_g","1"); localStorage.removeItem("_g"); this.mode="localStorage"; return; }catch(e){}
    this.mode="memory";
  },
  async get(){
    try{
      if(this.mode==="IndexedDB") return await new Promise((res,rej)=>{
        const q=this.db.transaction("kv","readonly").objectStore("kv").get("state");
        q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error);
      });
      if(this.mode==="localStorage"){ const v=localStorage.getItem("gleam"); return v?JSON.parse(v):null; }
    }catch(e){}
    return null;
  },
  async set(v){
    try{
      if(this.mode==="IndexedDB") return await new Promise((res,rej)=>{
        const q=this.db.transaction("kv","readwrite").objectStore("kv").put(v,"state");
        q.onsuccess=()=>res(); q.onerror=()=>rej(q.error);
      });
      if(this.mode==="localStorage") localStorage.setItem("gleam",JSON.stringify(v));

/* ================= LEDGER =================
   One entry per real-world event. Money is never stored as a mutable total —
   every figure below is derived from this list.

     clean      a = charged, p = paid at the time   → balance += (a - p)
     payment    a = received later                  → balance -= a
     opening    a = brought over from Aworka        → balance += a
     adjustment a = signed manual correction        → balance += a
     writeoff   a = forgiven                        → balance -= a
     price      from → to                           → no money effect
     skip       no charge                           → no money effect
*/
const HLABEL={opening:"Opening balance",payment:"Payment",writeoff:"Written off",adjustment:"Adjustment",
  price:"Price change",skip:"Skipped",clean:"Cleaned",
  legacy_payment:"Payment",legacy_writeoff:"Written off",legacy_price:"Price change",
  charge:"Clean charged",done:"Cleaned"};
const MONEY_TYPES=["clean","payment","opening","adjustment","writeoff","charge","done","legacy_payment","legacy_writeoff"];
const isMoney=h=>MONEY_TYPES.includes(h.t);
/* what an entry does to the balance (signed) */
function delta(h){
  const a=+h.a||0;
  switch(h.t){
    case "clean":     return a-(+h.p||0);
    case "opening":
    case "adjustment":
    case "charge":    return a;
    case "payment":
    case "writeoff":
    case "legacy_payment":
    case "legacy_writeoff": return -a;
    default:          return 0;   // price, skip, done, legacy_price
  }
}
const sortHist=h=>h.slice().sort((a,b)=> a.d<b.d?-1 : a.d>b.d?1 : (a.seqn||0)-(b.seqn||0));
function recalcBal(j){
  j.bal=Math.round(sortHist(j.hist||[]).reduce((b,h)=>b+delta(h),0)*100)/100;
}
function recalcAll(){ S.jobs.forEach(recalcBal); }
let HSEQ=0;
function entry(j,e){
  const h={id:"h"+Date.now().toString(36)+(HSEQ++).toString(36),d:e.d||TODAY(),seqn:HSEQ,...e};
  j.hist.push(h); return h;
}
function log(j,type,amt,note){ return entry(j,{t:type,a:amt||0,n:note||""}); }
/* ---- derived money figures ---- */
const cleansIn=(j,from,to)=>(j.hist||[]).filter(h=>h.t==="clean"&&h.d>=from&&h.d<=to);
/* earned = value of work done. collected = money actually received. */
function earnedOn(j,from,to){ return cleansIn(j,from,to).reduce((s,h)=>s+(+h.a||0),0); }
function paidOn(j,from,to){
  return (j.hist||[]).reduce((s,h)=>{
    if(h.d<from||h.d>to) return s;
    if(h.t==="payment"||h.t==="legacy_payment") return s+(+h.a||0);
    if(h.t==="clean") return s+(+h.p||0);
    return s;
  },0);
}
/* owing since = date of the oldest entry still unsettled, walking back from now.
   Derived, never stored — replaces the old drifting `bd` field. */
function owingSince(j){
  if(j.bal<=0) return "";
  const hs=sortHist(j.hist).filter(isMoney);
  let running=j.bal;
  for(let i=hs.length-1;i>=0;i--){
    running-=delta(hs[i]);
    if(running<=0) return hs[i].d;      // this entry is what tipped them into debt
  }
  return hs.length?hs[0].d:"";
}
const currentPrice=j=>+j.price||0;

/* BUG-01 + BUG-02 fix: advance from max(j.next, the day it was actually done),
   and always read/clear the keep-rhythm anchor. `onDate` lets a job be completed
   on a past day (day navigation, or a back-dated completion from Customers). */
function advanceNext(j,onDate){
  if(j.weeks<=0) return;
  const d=onDate||TODAY();
  if(j.anchor){
    let n=addD(j.anchor,j.weeks*7);
    while(dt(n)<=dt(d)) n=addD(n,j.weeks*7);
    j.next=n; j.anchor=null;
    return;
  }
  const basis=(j.next && dt(j.next)>dt(d))?j.next:d;
  j.next=addD(basis,j.weeks*7);
}

/* migrate an old-shape save (jobs.round string, flat bal, old hist types) into the new ledger + rounds-registry shape */
function migrateState(v){
  if(!v.settings) v.settings=JSON.parse(JSON.stringify(DEFAULTS.settings));
  if(!v.meta) v.meta={...DEFAULTS.meta};
  if(v.rounds && v.jobs.length && v.jobs[0].roundId!==undefined){
    v.jobs.forEach(j=>{ if(!j.hist) j.hist=[]; migrateLedger(j); recalcBal(j); });
    if(!v.dayOrders) v.dayOrders={};
    return v;
  }
  v.rounds=v.rounds||[];
  const roundIdFor={};
  const ensure=name=>{
    name=(name||"Unassigned").trim()||"Unassigned";
    if(roundIdFor[name]) return roundIdFor[name];
    let existing=v.rounds.find(r=>r.name===name);
    if(!existing){ existing={id:"r"+(v.rounds.length+1),name,order:v.rounds.length+1}; v.rounds.push(existing); }
    roundIdFor[name]=existing.id; return existing.id;
  };
  v.jobs.forEach(j=>{
    j.roundId=ensure(j.round||"Unassigned");
    delete j.round;
    const oldBal=+j.bal||0;
    const oldHist=(j.hist||[]).map(h=>{
      if(h.t==="pay") return {...h,t:"legacy_payment"};
      if(h.t==="writeoff") return {...h,t:"legacy_writeoff"};
      if(h.t==="price") return {...h,t:"legacy_price"};
      return h;
    });
    j.hist=oldBal?[{id:"h"+Date.now()+Math.random(),d:j.bd||TODAY(),t:"opening",a:oldBal,n:"Opening balance (migrated)"},...oldHist]:oldHist;
    delete j.bd;
    migrateLedger(j);
    recalcBal(j);
  });
  v.dayOrders=v.dayOrders||{};
  return v;
}
/* ledger v2: a clean now carries what was charged (a) and what was taken (p).
   Older saves used a boolean `paid`, and older-still used charge+done+payment triples. */
function migrateLedger(j){
  if(j._lv===2) return;
  const out=[];
  (j.hist||[]).forEach(h=>{
    if(h.t==="clean"){
      // boolean flag → amount
      if(h.p===undefined) h.p = h.paid ? (+h.a||0) : 0;
      delete h.paid;
      out.push(h); return;
    }
    if(h.t==="charge"){
      // old triple: a charge became its own row — fold it into a clean
      out.push({...h,t:"clean",p:0,n:h.n||"Not paid"}); return;
    }
    if(h.t==="done"){ return; }   // the old service-log twin of a charge: now redundant
    out.push(h);
  });
  // where an old triple logged a same-day payment against a same-day charge, net it onto the clean
  out.filter(h=>h.t==="clean"&&!h.p).forEach(c=>{
    const pay=out.find(h=>(h.t==="payment"||h.t==="legacy_payment")&&h.d===c.d&&!h._used&&(+h.a||0)<=(+c.a||0));
    if(pay){ c.p=+pay.a||0; c.m=pay.n||""; c.n=c.p>=(+c.a||0)?"Paid":"Part paid"; pay._used=true; }
  });
  j.hist=out.filter(h=>!h._used);
  j.hist.forEach(h=>{ delete h._used; });
  j._lv=2;
}

/* ================= DERIVED ================= */
const activeJobs=()=>S.jobs.filter(isActive);
/* A day owns its own jobs now. Nothing rolls forward on its own: a job sits on the
   date it was given until it's completed, skipped or deliberately moved. */
const dayDue=d=>activeJobs().filter(j=>j.next===d)
  .sort((a,b)=> roundName(a).localeCompare(roundName(b)) || a.seq-b.seq);
function dayDone(d){
  const out=[];
  S.jobs.forEach(j=>(j.hist||[]).forEach(h=>{
    if(h.d===d&&(h.t==="clean"||h.t==="done")) out.push({j,h,amt:+h.a||0,paid:+h.p||0});
  }));
  return out.sort((a,b)=>roundName(a.j).localeCompare(roundName(b.j))||a.j.seq-b.j.seq);
}
const dayDoneJobs=d=>{ const seen={},out=[]; dayDone(d).forEach(x=>{ if(!seen[x.j.id]){seen[x.j.id]=1;out.push(x.j);} }); return out; };
const dueToday=()=>dayDue(TODAY());
const doneToday=()=>dayDoneJobs(TODAY());
/* jobs whose day has been and gone without being dealt with */
const leftBehind=()=>activeJobs().filter(j=>j.next&&dt(j.next)<dt(TODAY()))
  .sort((a,b)=> (a.next<b.next?-1:a.next>b.next?1:0) || roundName(a).localeCompare(roundName(b)) || a.seq-b.seq);
const totalOwed=()=>activeJobs().reduce((s,j)=>s+Math.max(0,j.bal),0);
const totalCredit=()=>activeJobs().reduce((s,j)=>s+Math.max(0,-j.bal),0);

/* projection for schedule view — first visit is max(next, today) */
function projection(days){
  const start=TODAY(), end=addD(start,days-1), map={};
  activeJobs().filter(j=>j.weeks>0&&j.next).forEach(j=>{
    let d=dt(j.next)<dt(start)?start:j.next, guard=0;
    while(dt(d)<=dt(end)&&guard++<60){
      (map[d]=map[d]||[]).push(j);
      d=addD(d,j.weeks*7);
    }
  });
  Object.values(map).forEach(a=>a.sort((x,y)=>roundName(x).localeCompare(roundName(y))||x.seq-y.seq));
  return map;
}

const HOLD={t:null,fired:false,x:0,y:0};
function hold(e,ctx,id){
  if(e.target&&e.target.closest&&e.target.closest("button,a,input,select,textarea")) return;
  HOLD.fired=false; HOLD.x=e.clientX; HOLD.y=e.clientY;
  clearTimeout(HOLD.t);
  HOLD.t=setTimeout(()=>{
    HOLD.t=null; HOLD.fired=true;
    try{ if(navigator.vibrate) navigator.vibrate(18); }catch(_){}
    if(SEL.ctx===ctx) toggleSel(ctx,id); else enterSel(ctx,id);
  },400);
}
function holdCancel(){ if(HOLD.t){ clearTimeout(HOLD.t); HOLD.t=null; } }
document.addEventListener("pointermove",e=>{
  if(HOLD.t&&(Math.abs(e.clientX-HOLD.x)>9||Math.abs(e.clientY-HOLD.y)>9)) holdCancel();
},{passive:true});
document.addEventListener("pointerup",holdCancel,{passive:true});
document.addEventListener("pointercancel",holdCancel,{passive:true});
document.addEventListener("scroll",holdCancel,true);
/* a tap means: swallow the long-press, else toggle if selecting, else open the job */
function tapJob(ctx,id){
  if(HOLD.fired){ HOLD.fired=false; return; }
  if(SEL.ctx===ctx){ toggleSel(ctx,id); return; }
  jobSheet(id,ctx);
}
const holdAttr=(ctx,id)=>`onpointerdown="hold(event,'${ctx}','${id}')" oncontextmenu="return false"`;

function selBar(ctx){
  const js=selJobs(), n=js.length;
  const val=js.reduce((s,j)=>s+(+j.price||0),0);
  const pool=selPool(ctx), allOn=pool.length&&n>=pool.length;
  const d=n?"":"disabled";
  const acts = ctx==="cust"
    ? `<button class="btn primary" ${d} onclick="bulkCompleteSheet('${ctx}')">Complete</button>
       <button class="btn" ${d} onclick="bulkMoveSheet('${ctx}')">Put on a day</button>
       <button class="btn ghost" ${d} onclick="bulkRoundSheet('${ctx}')">Round</button>`
    : `<button class="btn primary" ${d} onclick="bulkCompleteSheet('${ctx}')">Complete</button>
       <button class="btn" ${d} onclick="bulkMoveSheet('${ctx}')">Move</button>
       <button class="btn ghost" ${d} onclick="bulkSkipSheet('${ctx}')">Skip</button>`;
  return `<div class="selbar2 glass">
    <div class="selhead"><b>${n} selected</b>${n?`<em>${fmt(val)}</em>`:""}
      <button class="selmini pull" onclick="${allOn?`selNone('${ctx}')`:`selAll('${ctx}')`}">${allOn?"Unselect all":"Select all"}</button>
      <button class="selmini" onclick="selExit('${ctx}')">Done</button></div>
    <div class="acts">${acts}</div>
  </div>`;
}

/* ---- bulk actions ---- */
function bulkDefaultDate(ctx){
  if(ctx==="today") return UI.day||TODAY();
  if(ctx==="cal") return UI.calSel||TODAY();
  return TODAY();
}
function bulkCompleteSheet(ctx){
  const js=selJobs(); if(!js.length){ toast("Nothing selected"); return; }
  const total=js.reduce((s,j)=>s+(+j.price||0),0);
  sheet(`<h3>Complete ${js.length} job${js.length===1?"":"s"}</h3>
    <div class="sub">${fmt(total)} of work · ${esc(js.slice(0,3).map(nameOf).join(", "))}${js.length>3?" +"+(js.length-3)+" more":""}</div>
    <label>Date completed</label><input id="bcDate" type="date" value="${bulkDefaultDate(ctx)}">
    <div class="preview">Each one gets its own clean logged on that date. Anything paid differently can be fixed on their card afterwards.</div>
    <div class="acts">
      <button class="btn paid" onclick="doBulkComplete('${ctx}','full')">All paid</button>
      <button class="btn warn" onclick="doBulkComplete('${ctx}','none')">None paid</button>
    </div>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Cancel</button>`);
}
function doBulkComplete(ctx,status){
  const d=($("bcDate")&&$("bcDate").value)||bulkDefaultDate(ctx);
  const js=selJobs(); if(!js.length) return;
  closeSheet(); snap();
  let charged=0,paid=0;
  js.forEach(j=>{ const r=completeJob(j,{status,date:d}); charged+=r.charged; paid+=r.paid; });
  const n=js.length; selExit(ctx,true); save(); render();
  const owed=Math.round((charged-paid)*100)/100;
  toast(n+" cleaned "+(d===TODAY()?"":"on "+uk(d)+" ")+"· "+(paid?fmt(paid)+" taken":fmt(owed)+" on the bill"),"Undo",undo);
}
function bulkMoveSheet(ctx){
  const js=selJobs(); if(!js.length){ toast("Nothing selected"); return; }
  const from=bulkDefaultDate(ctx);
  sheet(`<h3>Move ${js.length} job${js.length===1?"":"s"}</h3>
    <div class="sub">${esc(js.slice(0,3).map(nameOf).join(", "))}${js.length>3?" +"+(js.length-3)+" more":""}</div>
    <label>New date</label><input id="bmDate" type="date" value="${addD(from,1)}">
    <div class="preview"><b>Keep rhythm</b> — this visit moves, but their normal cycle carries on from the original date.<br><b>Shift schedule</b> — the new date becomes their cycle going forward.</div>
    <div class="acts">
      <button class="btn primary" onclick="doBulkMove('${ctx}',true)">Keep rhythm</button>
      <button class="btn" onclick="doBulkMove('${ctx}',false)">Shift schedule</button>
    </div>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Cancel</button>`);
}
function doBulkMove(ctx,keep){
  const target=$("bmDate")&&$("bmDate").value;
  if(!target){ toast("Pick a date"); return; }
  const js=selJobs(); if(!js.length) return;
  snap();
  js.forEach(j=>{ if(j.weeks>0) j.anchor=(keep&&j.next)?j.next:null; if(!j.weeks&&!j.next) j.anchor=null; j.next=target; });
  const n=js.length; selExit(ctx,true); closeSheet(); save(); render();
  toast(n+" moved to "+uk(target),"Undo",undo);
}
function bulkSkipSheet(ctx){
  const js=selJobs(); if(!js.length){ toast("Nothing selected"); return; }
  sheet(`<h3>Skip ${js.length} job${js.length===1?"":"s"}</h3>
    <div class="sub">No charge. Each one rolls on to its next visit.</div>
    <label>Reason (optional)</label><input id="bsWhy" placeholder="Rained off, gates locked, away…">
    <div class="acts">
      <button class="btn primary" onclick="doBulkSkip('${ctx}')">Skip them</button>
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
    </div>`);
}
function doBulkSkip(ctx){
  const why=(($("bsWhy")&&$("bsWhy").value)||"").trim()||"No reason given";
  const d=bulkDefaultDate(ctx), js=selJobs(); if(!js.length) return;
  closeSheet(); snap();
  js.forEach(j=>{ j.last=d; advanceNext(j,d); entry(j,{t:"skip",d,a:0,n:why}); });
  const n=js.length; selExit(ctx,true); save(); render();
  toast(n+" skipped","Undo",undo);
}
function bulkRoundSheet(ctx){
  const js=selJobs(); if(!js.length){ toast("Nothing selected"); return; }
  sheet(`<h3>Move ${js.length} to another round</h3><div class="sub">Their day and price stay as they are.</div>
    <label>Round</label><select id="brRound">${roundsSorted().map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select>
    <button class="btn primary" style="width:100%" onclick="doBulkRound('${ctx}')">Move them</button>`);
}
function doBulkRound(ctx){
  const rid=$("brRound")&&$("brRound").value; if(!rid) return;
  const js=selJobs(); if(!js.length) return;
  snap();
  js.forEach(j=>{ j.roundId=rid; });
  resequence(S.jobs);
  const n=js.length, nm=(S.rounds.find(r=>r.id===rid)||{}).name||"round";
  selExit(ctx,true); closeSheet(); save(); render();
  toast(n+" moved to "+nm,"Undo",undo);
}

/* ---- left behind (yesterday and before, still not dealt with) ---- */
function lateSheet(){
  const js=leftBehind();
  if(!js.length){ closeSheet(); toast("Nothing left behind"); return; }
  if(SEL.ctx!=="late") SEL={ctx:"late",ids:[]};
  const val=js.reduce((s,j)=>s+(+j.price||0),0);
  sheet(`<h3>Left behind</h3><div class="sub">${js.length} jobs · ${fmt(val)} · still sitting on their old day</div>
    ${selBar("late")}
    <button class="btn primary" style="width:100%;margin-bottom:10px" onclick="lateToToday()">Bring ${SEL.ids.length?SEL.ids.length:"all "+js.length} to today</button>
    <div class="list" style="background:rgba(255,255,255,.05);border:1px solid var(--edge)">
      ${js.map(j=>`<div class="item${selHas(j.id)?" picked":""}" onclick="tapJob('late','${j.id}')" ${holdAttr("late",j.id)}>
        <div class="tick${selHas(j.id)?" on":""}">${selHas(j.id)?"✓":""}</div>
        <div class="grow"><b>${esc(nameOf(j))}</b><span>${esc(roundName(j))} · was due ${uk(j.next)} · ${daysBetween(j.next,TODAY())} days ago</span></div>
        <div class="num">${fmt(j.price)}</div></div>`).join("")}
    </div>
    <div class="preview" style="margin-top:12px">Tap to pick, or use Select all. Nothing here has moved on its own — it's exactly where you left it.</div>`);
}
function lateToToday(){
  const js=SEL.ids.length?selJobs():leftBehind();
  if(!js.length) return;
  snap();
  js.forEach(j=>{ j.anchor=null; j.next=TODAY(); });
  const n=js.length; SEL={ctx:null,ids:[]};
  closeSheet(); save(); render();
  toast(n+" brought to today","Undo",undo);
}

/* ---- TODAY ---- */
function orderedDay(d){
  let js=dayDue(d);
  const ord=(S.dayOrders||{})[d];
  if(ord) js=js.slice().sort((a,b)=>{
    const i=ord.indexOf(a.id), k=ord.indexOf(b.id);
    return (i<0?9999:i)-(k<0?9999:k);
  });
  return js;
}
function toggleCompact(){ S.settings.compactToday=!S.settings.compactToday; save(); pgToday(); }
function dayLabel(d){
  if(d===TODAY()) return "Today";
  if(d===addD(TODAY(),1)) return "Tomorrow";
  if(d===addD(TODAY(),-1)) return "Yesterday";
  return dt(d).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});
}
function setDay(d){
  UI.day=d; UI.todayAll=false; UI.todayQ="";
  if(SEL.ctx==="today") SEL={ctx:null,ids:[]};
  pgToday(); pgSchedule();
  const m=$("main"); if(m) m.scrollTop=0;
}
function shiftDay(n){ setDay(addD(UI.day||TODAY(),n)); }
/* the week the viewed day sits in — the Today screen's own little calendar */
function weekStrip(d){
  const start=startOfWeek(d);
  return `<div class="wkstrip">${[0,1,2,3,4,5,6].map(i=>{
    const k=addD(start,i), n=dayDue(k).length, dn=dayDone(k).length;
    return `<button class="wkday${k===d?" on":""}${k===TODAY()?" now":""}" onclick="setDay('${k}')" aria-label="${uk(k)}">
      <i>${dt(k).toLocaleDateString("en-GB",{weekday:"short"}).slice(0,1)}</i><b>${+k.slice(8)}</b>
      <s class="${n?"":dn?"clean":"none"}">${n?n:dn?"✓"+dn:"·"}</s></button>`;
  }).join("")}</div>`;
}
function pickDay(){
  sheet(`<h3>Jump to a day</h3><div class="sub">Today's screen works on any date — past or future.</div>
    <label>Date</label><input id="jumpDate" type="date" value="${UI.day||TODAY()}">
    <div class="acts">
      <button class="btn primary" onclick="doPickDay()">Go</button>
      <button class="btn ghost" onclick="closeSheet();setDay(TODAY())">Today</button>
    </div>`);
}
function doPickDay(){ const d=$("jumpDate").value; if(!d){ toast("Pick a date"); return; } closeSheet(); setDay(d); }

function pgToday(){
  if(!UI.day) UI.day=TODAY();
  const d=UI.day, isT=d===TODAY();
  const list=orderedDay(d), doneEntries=dayDone(d);
  const total=list.length+doneEntries.length;
  const earned=doneEntries.reduce((s,x)=>s+x.amt,0);
  const remaining=list.reduce((s,j)=>s+(+j.price||0),0);
  const roundsToday=[...new Set([...list.map(roundName),...doneEntries.map(x=>roundName(x.j))])];
  const pct=total?Math.round(doneEntries.length/total*100):0;
  const compact=!!S.settings.compactToday;
  const picking=selOn("today");
  const spot=list[0], rest=list.slice(1);
  const cap=UI.todayAll?rest.length:24;
  const shown=rest.slice(0,cap), hidden=rest.length-shown.length;
  const late=isT?leftBehind():[];
  $("p-today").innerHTML=`
    <div class="titlerow">
      <div style="min-width:0">
        <div class="pagetitle">${dayLabel(d)}</div>
        <div class="daysub">${uk(d)}${isT?"":" · "+(dt(d)<dt(TODAY())?daysBetween(d,TODAY())+" days ago":"in "+daysBetween(TODAY(),d)+" days")}</div>
      </div>
      <div class="daynav">
        <button onclick="shiftDay(-1)" aria-label="Previous day">‹</button>
        <button onclick="pickDay()" aria-label="Pick a day">🗓</button>
        <button onclick="shiftDay(1)" aria-label="Next day">›</button>
      </div>
    </div>
    ${weekStrip(d)}
    <div class="dayflags">
      ${isT?"":`<button class="btn" onclick="setDay(TODAY())">Back to today</button>`}
      <button class="btn ghost" style="flex:1" onclick="toggleCompact()">${compact?"▤ Full cards":"☰ Compact"}</button>
      ${list.length?`<button class="btn ghost" style="flex:1" onclick="rainDay()">☔ Rain</button>`:""}
    </div>
    ${late.length&&!picking?`<div class="strip" onclick="lateSheet()">
      <span>☂</span><div><b>${late.length} job${late.length===1?"":"s"} left behind</b> · ${fmt(late.reduce((s,j)=>s+(+j.price||0),0))} still sitting on earlier days</div>
      <span class="go">Review ›</span></div>`:""}
    <div class="todaysearch">
      <div class="searchwrap">
        <span class="si">🔍</span>
        <input id="todaySearch" placeholder="Find a customer or round" value="${esc(UI.todayQ)}" oninput="UI.todayQ=this.value;renderTodaySearch();toggleClear('todayClear',this.value)">
        <button class="clearbtn" id="todayClear" style="display:${UI.todayQ?"grid":"none"}" onclick="UI.todayQ='';pgToday();setTimeout(()=>$('todaySearch')&&$('todaySearch').focus(),0)" aria-label="Clear">✕</button>
      </div>
      <button class="addbtn" onclick="quickAdd()" aria-label="Add customer">＋ New</button>
    </div>
    <div id="todayResults">${todaySearchHTML()}</div>
    <div id="todayRun" class="${picking?"selmode":""}" style="${UI.todayQ.trim()?"display:none":""}">
    ${picking?selBar("today"):""}
    ${total&&!picking?`<div class="progresshero glass">
      <div class="prog-top">
        <div><div class="prog-count">${doneEntries.length}<span>/${total}</span></div>${pct===100?`<small>all done — nice one</small>`:""}</div>
        <div class="prog-money"><div><b class="clean">${fmt(earned)}</b><span>${isT?"earned":"logged"}</span></div><div><b class="suds">${fmt(remaining)}</b><span>left</span></div></div>
      </div>
      <div class="prog-bar"><i style="width:${pct}%"></i></div>
      ${roundsToday.length?`<div class="prog-rounds">${roundsToday.map(r=>`<span class="chip round">${esc(r)}</span>`).join("")}</div>`:""}
    </div>`:""}
    ${list.length&&!picking?`<div class="holdhint">Hold a job to pick several at once</div>`:""}
    ${compact
      ? (spot?compactRow(spot,true,0,list.length):"")+shown.map((j,i)=>compactRow(j,false,i+1,list.length)).join("")
      : (spot?jobCard(spot,true,0,list.length):"")+shown.map((j,i)=>jobCard(j,false,i+1,list.length)).join("")}
    ${hidden>0?`<button class="btn" style="width:100%;margin:2px 0 10px" onclick="UI.todayAll=true;pgToday()">Show ${hidden} more</button>`:""}
    ${UI.todayAll&&list.length>25?`<button class="btn ghost" style="width:100%;margin:2px 0 10px" onclick="UI.todayAll=false;pgToday();$('main').scrollTop=0">Collapse</button>`:""}
    ${!list.length?`<div class="empty"><div>${doneEntries.length?"✨":"🗓"}</div><b>${doneEntries.length?"Day's done":"Nothing on this day"}</b>${doneEntries.length?"Everything booked in has been cleaned.":"Search above to put a job on "+(isT?"today":uk(d))+", or swipe the arrows to another day."}</div>`:""}
    ${doneEntries.length?`<div class="sect"><span>Cleaned ${isT?"today":"this day"}</span><span>${fmt(earned)}</span></div>
      <div class="list glass">${doneEntries.map(x=>`<div class="item doneitem" onclick="jobSheet('${x.j.id}')">
        <div class="grow"><b>${esc(x.j.addr)}</b><span>${esc(roundName(x.j))} · ${x.paid>=x.amt&&x.amt?"paid":x.paid?"part paid "+fmt(x.paid):"not paid"} · next ${uk(x.j.next)}</span></div>
        <div class="num clear">${fmt(x.amt)}</div></div>`).join("")}</div>`:""}
    </div>`;
}
/* (removed) previous unscheduled-count suggestion strip */
function todaySuggestHTML(){ return ""; }
function _oldSuggest(){
  const rs=roundsSorted().map(r=>({r,unsched:jobsInRound(r.id).filter(j=>isActive(j)&&j.weeks>0&&!j.next).length}))
    .filter(x=>x.unsched>0).sort((a,b)=>b.unsched-a.unsched).slice(0,8);
  const totalUn=S.jobs.filter(j=>isActive(j)&&j.weeks>0&&!j.next).length;
  if(!rs.length) return "";
  return `<div class="suggest">
    <div class="lbl">${totalUn} job${totalUn===1?"":"s"} still need a day · jump to a round</div>
    <div class="suggestrow">
      ${rs.map(x=>`<span class="chip round" onclick="roundSheet('${x.r.id}')">${esc(x.r.name)} · ${x.unsched}</span>`).join("")}
    </div>
  </div>`;
}
/* mixed round + job search from the Today screen — rounds first, then their jobs */
function todaySearchHTML(){
  const q=UI.todayQ.toLowerCase().trim();
  if(!q) return "";
  const roundHits=roundsSorted().filter(r=>r.name.toLowerCase().includes(q));
  const jobHits=S.jobs.filter(isActive).filter(j=>(nameOf(j)+" "+j.addr+" "+roundName(j)).toLowerCase().includes(q))
    .sort((a,b)=>roundName(a).localeCompare(roundName(b))||a.seq-b.seq).slice(0,60);
  if(!roundHits.length && !jobHits.length)
    return `<div class="empty" style="padding:26px 20px"><div>🔍</div><b>No match</b>Try a name, street or round.</div>`;
  return `<div class="list glass" style="margin-bottom:14px">
    ${roundHits.map(r=>`<div class="item" onclick="roundSheet('${r.id}')">
      <div class="grow"><b>${esc(r.name)}</b><span>${jobsInRound(r.id).filter(isActive).length} jobs</span></div>
      <span class="restag round">Round</span></div>`).join("")}
    ${jobHits.map(j=>`<div class="item">
      <div class="grow" onclick="jobSheet('${j.id}')"><b>${esc(nameOf(j))}</b><span>${esc(roundName(j))} · ${esc(j.addr)}${j.next?" · "+uk(j.next):" · unscheduled"}</span></div>
      <button class="restag done" onclick="askComplete('${j.id}')" aria-label="Complete now">✓ Done</button>
      <button class="restag job" onclick="scheduleSheet('${j.id}')" aria-label="Add to a day">＋ Day</button></div>`).join("")}
  </div>`;
}
function renderTodaySearch(){
  const el=$("todayResults"); if(el) el.innerHTML=todaySearchHTML();
  const run=$("todayRun"); if(run) run.style.display=UI.todayQ.trim()?"none":"";
}
function toggleClear(id,val){ const b=$(id); if(b) b.style.display=val?"grid":"none"; }
/* pick a day for a job (used from Today search + job detail); keeps its 4-weekly rhythm going forward */
function scheduleSheet(id){
  const j=S.jobs.find(x=>x.id===id); if(!j) return;
  sheet(`<h3>Schedule ${esc(nameOf(j))}</h3><div class="sub">${esc(j.addr)} · ${esc(roundName(j))} · ${freqLabel(j.weeks)}</div>
    <label>Put on this day</label><input id="schDate" type="date" value="${UI.day||TODAY()}">
    <div class="preview">It'll recur every ${j.weeks||4} weeks from this date. Change the frequency in Edit if needed.</div>
    <div class="acts">
      <button class="btn primary" onclick="doSchedule('${id}',true)">Add to ${(UI.day||TODAY())===TODAY()?"today":uk(UI.day)}</button>
      <button class="btn" onclick="doSchedule('${id}',false)">Use chosen date</button>
    </div>`);
}
function doSchedule(id,useToday){
  const j=S.jobs.find(x=>x.id===id); if(!j) return;
  const target=useToday?(UI.day||TODAY()):($("schDate").value||UI.day||TODAY());
  snap();
  if(!j.weeks) j.weeks=4;
  j.next=target; j.anchor=null;
  UI.todayQ=""; UI.day=target;
  closeSheet(); save(); render(); go('today');
  toast(nameOf(j)+" scheduled for "+uk(target),"Undo",undo);
}

    <div class="grime"></div><div class="blade"></div>
    ${picking?selMark("today",j.id):""}
    <div class="row1" onclick="tapJob('today','${j.id}')">
      <div class="r1l"><div class="addr">${esc(j.addr)}</div>${j.name?`<div class="who">${esc(j.name)}</div>`:""}</div>
      <div class="r1r" onclick="event.stopPropagation()">
        <div class="cardtools">
          <button ${i===0?"disabled":""} onclick="moveToday('${j.id}',-1)" aria-label="Up">↑</button>
          <button ${i>=total-1?"disabled":""} onclick="moveToday('${j.id}',1)" aria-label="Down">↓</button>
          <button onclick="moveSheet('job','${j.id}')" aria-label="Move to date">⤓</button>
        </div>
        <div class="price">${j.price?fmt(j.price):"No price"}</div>
      </div>
    </div>
    <div class="meta" onclick="tapJob('today','${j.id}')">
      <span class="chip round">${esc(roundName(j))} · ${j.seq}</span>
      <span class="chip">${freqLabel(j.weeks)}</span>
      ${overdue(j)?`<span class="chip late">Due ${uk(j.next)}</span>`:""}
      ${j.bal>0?`<span class="chip debt">Owes ${fmt(j.bal)}</span>`:""}
      ${j.bal<0?`<span class="chip rise">${fmt(-j.bal)} in credit</span>`:""}

    <div class="acts" id="a${j.id}">
      <button class="btn primary" onclick="event.stopPropagation();askPay('${j.id}')">Complete</button>

      <button class="btn ghost" onclick="event.stopPropagation();jobSheet('${j.id}')">Details</button>
    </div>
  </div>`;
}
function compactRow(j,spotlight,i,total){
  const picking=selOn("today"), on=selHas(j.id);
  return `<div class="citem${spotlight&&!picking?" spot":""}${on?" picked":""}" id="c${j.id}" ${holdAttr("today",j.id)}>
    ${picking?selMark("today",j.id):""}

function moveToday(id,dir){
  const d=UI.day||TODAY();
  const js=orderedDay(d).slice();
  const i=js.findIndex(j=>j.id===id), k=i+dir;
  if(i<0||k<0||k>=js.length) return;
  [js[i],js[k]]=[js[k],js[i]];
  S.dayOrders=S.dayOrders||{}; S.dayOrders[d]=js.map(j=>j.id);
  syncRoundOrder(js);

/* keep each round's sequence in step with how its jobs are ordered on the day */
function syncRoundOrder(list){
  const byRound={};
  list.forEach(j=>{ (byRound[j.roundId]=byRound[j.roundId]||[]).push(j); });
  Object.values(byRound).forEach(l=>{
    const slots=l.map(j=>j.seq).sort((a,b)=>a-b);
    l.forEach((j,idx)=>{ j.seq=slots[idx]; });
  });
}

/* Every date in a month: what's still booked on it, and what actually got cleaned.
   Past days keep their work — nothing rolls forward on its own. */
function monthMap(y,m){
  const pad=n=>String(n).padStart(2,"0");
  const start=`${y}-${pad(m+1)}-01`, end=iso(new Date(y,m+1,0));
  const map={};
  const push=(d,k,j)=>{ (map[d]=map[d]||{due:[],done:[]})[k].push(j); };
  activeJobs().forEach(j=>{
    if(!j.next) return;
    if(j.weeks>0&&dt(j.next)>=dt(TODAY())){
      let d=j.next, guard=0;
      while(d<=end&&guard++<80){ if(d>=start) push(d,"due",j); d=addD(d,j.weeks*7); }
    }else if(j.next>=start&&j.next<=end){
      push(j.next,"due",j);                    // an old day that never got done, or a one-off
    }
  });
  S.jobs.forEach(j=>(j.hist||[]).forEach(h=>{
    if((h.t==="clean"||h.t==="done")&&h.d>=start&&h.d<=end) push(h.d,"done",{j,h,amt:+h.a||0,paid:+h.p||0});
  }));
  Object.values(map).forEach(v=>v.due.sort((x,y)=>roundName(x).localeCompare(roundName(y))||x.seq-y.seq));
  return map;
}
function calDayJobs(){
  if(!UI.calSel) return [];
  const y=+UI.calSel.slice(0,4), m=+UI.calSel.slice(5,7)-1;

}

function custMatches(){
  const q=UI.custQ.toLowerCase().trim();
  let js=S.jobs.filter(j=>!q||(j.name+" "+j.addr+" "+roundName(j)+" "+j.ph).toLowerCase().includes(q));
  const F=UI.custFilter;
  if(F==="all") js=js.filter(isActive);

  if(F==="owing") js=js.filter(j=>isActive(j)&&j.bal>0);
  if(F==="nophone") js=js.filter(j=>isActive(j)&&!j.ph);
  if(F==="off") js=js.filter(j=>!isActive(j));
  if(UI.custRound!=="all") js=js.filter(j=>j.roundId===UI.custRound);
  const sort=UI.custSort;
  js.sort((a,b)=>{
    if(sort==="name") return nameOf(a).localeCompare(nameOf(b));
    if(sort==="balance") return b.bal-a.bal;
    if(sort==="next") return (a.next||"9999").localeCompare(b.next||"9999");
    if(sort==="overdue") return (overdue(b)?1:0)-(overdue(a)?1:0) || (a.next||"9999").localeCompare(b.next||"9999");
    return roundName(a).localeCompare(roundName(b))||a.seq-b.seq||a.addr.localeCompare(b.addr);
  });
  return js;
}

   Per-customer money lives on the Customers tab and in the job sheets.

/* UK tax year runs 6 April → 5 April */
function taxYearStart(d){ const y=+d.slice(0,4); return d>=(y+"-04-06") ? y+"-04-06" : (y-1)+"-04-06"; }
function startOfWeek(d){ const dow=(dt(d).getDay()+6)%7; return addD(d,-dow); }          // Monday
function startOfMonth(d){ return d.slice(0,8)+"01"; }
function endOfMonth(d){ const x=dt(d); return iso(new Date(x.getFullYear(),x.getMonth()+1,0)); }
function firstEntryDate(){
  let m="";
  S.jobs.forEach(j=>(j.hist||[]).forEach(h=>{ if(h.d&&(!m||h.d<m)) m=h.d; }));
  return m||TODAY();
}
function periodRange(key){
  const t=TODAY();
  if(key==="week"){ const f=startOfWeek(t); return {from:f,to:addD(f,6),label:"Week of "+shortD(f)}; }
  if(key==="month"){ const f=startOfMonth(t); return {from:f,to:endOfMonth(t),label:dt(t).toLocaleDateString("en-GB",{month:"long",year:"numeric"})}; }
  if(key==="tax"){ const f=taxYearStart(t), y=+f.slice(0,4); return {from:f,to:(y+1)+"-04-05",label:"Tax year "+y+"/"+String(y+1).slice(2)}; }
  return {from:firstEntryDate(),to:t,label:"Everything to date"};
}
/* one pass over the whole ledger for a date window */
function totalsIn(from,to){
  let earned=0, collected=0, paidAtClean=0, cleans=0, skips=0, writeoffs=0;
  const byMethod={};
  const add=(m,v)=>{ m=m||"Unknown"; byMethod[m]=(byMethod[m]||0)+v; };
  S.jobs.forEach(j=>(j.hist||[]).forEach(h=>{
    if(!h.d||h.d<from||h.d>to) return;
    if(h.t==="clean"){ earned+=+h.a||0; cleans++; if(+h.p>0){ collected+=+h.p; paidAtClean+=+h.p; add(h.m,+h.p); } }
    else if(h.t==="payment"||h.t==="legacy_payment"){ collected+=+h.a||0; add(h.m||h.n,+h.a||0); }
    else if(h.t==="writeoff"||h.t==="legacy_writeoff"){ writeoffs+=+h.a||0; }
    else if(h.t==="skip"){ skips++; }
  }));
  return {earned:r2(earned), collected:r2(collected), paidAtClean:r2(paidAtClean), cleans, skips, writeoffs:r2(writeoffs), byMethod};
}
const r2=n=>Math.round((+n||0)*100)/100;
/* trend buckets — granularity follows the window, but the count is always bounded
   so no data shape (e.g. a stray historical date) can blow this up. */
function trendBuckets(from,to){
  // guard against malformed dates
  if(!/^\d{4}-\d\d-\d\d$/.test(from)||!/^\d{4}-\d\d-\d\d$/.test(to)||dt(from)>dt(to)) return [];
  const days=daysBetween(from,to)+1;
  const out=[]; let guard=0;
  const push=(f,t,l)=>{ if(guard++>400) return; out.push({from:f,to:t,label:l}); };
  if(days<=14){
    for(let d=from; dt(d)<=dt(to)&&guard<=400; d=addD(d,1)) push(d,d,dt(d).toLocaleDateString("en-GB",{weekday:"narrow"}));
  }else if(days<=120){                                   // ~4 months → weekly
    for(let d=startOfWeek(from); dt(d)<=dt(to)&&guard<=400; d=addD(d,7)) push(d,addD(d,6),uk(d).slice(0,5));
  }else if(days<=760){                                   // ~2 years → monthly
    for(let d=startOfMonth(from); dt(d)<=dt(to)&&guard<=400; d=addD(endOfMonth(d),1)) push(d,endOfMonth(d),dt(d).toLocaleDateString("en-GB",{month:"narrow"}));
  }else if(days<=2200){                                  // ~6 years → quarterly
    let d=startOfMonth(from); d=d.slice(0,5)+String(Math.floor((+d.slice(5,7)-1)/3)*3+1).padStart(2,"0")+"-01";
    for(; dt(d)<=dt(to)&&guard<=400;){ const qEnd=endOfMonth(addD(endOfMonth(addD(endOfMonth(d),1)),1));
      push(d,qEnd,"Q"+(Math.floor((+d.slice(5,7)-1)/3)+1)+" "+d.slice(2,4)); d=addD(qEnd,1); }
  }else{                                                 // longer → yearly
    for(let y=+from.slice(0,4); y<=+to.slice(0,4)&&guard<=400; y++) push(y+"-01-01",y+"-12-31",String(y).slice(2));
  }
  return out.map(b=>{ const t=totalsIn(b.from,b.to); return {...b,earned:t.earned,collected:t.collected}; });
}
/* how long the money has been outstanding */
function ageing(){
  const b={cur:{n:0,v:0},d30:{n:0,v:0},d60:{n:0,v:0},d90:{n:0,v:0}};
  activeJobs().filter(j=>j.bal>0).forEach(j=>{
    const since=owingSince(j);
    const age=since?daysBetween(since,TODAY()):0;
    const k = age>=90?"d90" : age>=60?"d60" : age>=30?"d30" : "cur";
    b[k].n++; b[k].v=r2(b[k].v+j.bal);
  });
  return b;
}
function roundPerf(from,to){
  return roundsSorted().map(r=>{
    let earned=0,mins=0,cleans=0;
    jobsInRound(r.id).forEach(j=>(j.hist||[]).forEach(h=>{
      if(h.t==="clean"&&h.d>=from&&h.d<=to){ earned+=+h.a||0; mins+=(+j.mins||30); cleans++; }
    }));
    return {id:r.id,name:r.name,earned:r2(earned),mins,cleans,rate:mins?earned/(mins/60):0};
  }).filter(x=>x.cleans>0).sort((a,b)=>b.earned-a.earned);
}

/* status: "full" | "none" | "part" — one clean entry records what was charged AND what was taken */
/* the one place a clean gets written. status: "full" | "none" | "part" */
function completeJob(j,o){
  o=o||{};
  const date=o.date||TODAY();
  const charged=currentPrice(j);
  const paid = o.status==="full" ? charged : o.status==="part" ? money(o.amt) : 0;
  j.last=date;
  advanceNext(j,date);
  entry(j,{t:"clean",d:date,a:charged,p:paid,m:paid>0?(o.how||j.pay||"Cash"):"",
    n:!charged?"Done":paid>=charged?"Paid":paid>0?"Part paid":"Not paid"});
  if(paid>0&&o.how) j.pay=o.how;
  recalcBal(j);
  return {charged,paid};
}
function finishDone(id,status,amt,how,date){
  const j=S.jobs.find(x=>x.id===id); if(!j) return;
  const el=$("c"+id);
  let d=date||UI.day||TODAY();

  const apply=()=>{
    snap();
    const r=completeJob(j,{status,amt,how,date:d});
    save(); render();
    const owed=Math.round((r.charged-r.paid)*100)/100;
    const when=d===TODAY()?"":" on "+uk(d);

function statementHTML(j){

  const shown=(UI.histMoney?rows.filter(r=>isMoney(r.h)):rows).reverse();
  if(!shown.length) return `<div class="preview">Nothing logged yet. Cleans, payments and price changes all land here.</div>`;
  return `<div class="stmt">

      const paid = h.t==="clean"?(+h.p||0) : (h.t==="payment"||h.t==="legacy_payment"||h.t==="writeoff"||h.t==="legacy_writeoff")?(+h.a||0) : 0;

      return `<div class="stmt-r" onclick="editHist('${j.id}',${r.idx})">

function saveJob(id){

  const addr=g("addr").trim();
  if(!addr){ toast("An address is needed"); return; }

  const price=money(g("price"));
  const r=ensureRound(pickedRoundName("e"));

    const adj=Math.round((newBal-j.bal)*100)/100;
    if(adj!==0) log(j,"adjustment",adj,"Balance edited manually");
    Object.assign(j,{name:g("name").trim(),addr,pc:g("pc").trim(),roundId:r.id,
      ph:g("ph").trim(),email:g("email").trim(),price,weeks:+g("weeks"),
      next:g("next"),seq:+g("seq")||99,mins:+g("mins")||30,pay:g("pay"),notes:g("notes").trim()});
    recalcBal(j);
  }else{
    const nj={id:"j"+Date.now(),jid:0,name:g("name").trim(),addr,pc:g("pc").trim(),roundId:r.id,
      seq:+g("seq")||(activeJobs().filter(x=>x.roundId===r.id).length+1),price,weeks:+g("weeks"),next:g("next"),last:"",
