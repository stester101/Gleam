name: Build Gleam 2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - gleam-2-native
    paths:
      - "android/**"
      - "tests/**"
      - ".github/workflows/gleam2-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The signing identity lives in a repository secret (base64 keystore), never in a
      # cache: caches expire after 7 days unused, which silently rotated the key before.
      # Without the secret, CI only compiles and refuses to produce an APK.
      - name: Restore stable signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.GLEAM_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GLEAM_DEBUG_KEYSTORE_B64 secret missing - compiling only, no APK"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Check embedded Gleam JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("android/app/src/main/assets/index.html").read_text()
          script = html.rsplit("<script>", 1)[1].rsplit("</script>", 1)[0]
          Path("/tmp/gleam.js").write_text(script)
          PY
          node --check /tmp/gleam.js

      - name: Logic tests (ledger, scheduling, widget sync)
        run: TZ=Europe/London node tests/gleam-logic.test.js android/app/src/main/assets/index.html

      - name: Read app version
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Compile only (no signing key)
        if: steps.signing.outputs.present != 'true'
        run: gradle -p android compileReleaseSources --stacktrace

      # Release build: not debuggable (customer data can't be pulled over USB),
      # signed with the same stable key so it installs over earlier alphas.
      - name: Build APK
        if: steps.signing.outputs.present == 'true'
        run: gradle -p android assembleRelease --stacktrace

      - name: Upload APK
        if: steps.signing.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Gleam-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
