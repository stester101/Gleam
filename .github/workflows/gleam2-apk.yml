name: Build Gleam 2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - gleam-2-native
    paths:
      - "android/**"
      - ".github/workflows/gleam2-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gleam-debug-signing-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Check embedded Gleam JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("android/app/src/main/assets/index.html").read_text()
          script = html.rsplit("<script>", 1)[1].rsplit("</script>", 1)[0]
          Path("/tmp/gleam.js").write_text(script)
          PY
          node --check /tmp/gleam.js

      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gleam-2-alpha2
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
